[package]
name = "dither"
version = "0.11.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
askama = "0.16.1"
askama_datastar = "0.1.0"
askama_gettext = { git = "https://github.com/radiosilence/blit", rev = "e59c04abc9d81d6922028974f233f9c408443f99", version = "0.1.0" }
# Arc rather than Rc in the plural rules' data, so the catalogues can be shared
# between the server's threads.
icu_provider = { version = "2", features = ["sync"] }
async-stream = "0.3.6"
axum = { version = "0.8.9", features = ["macros"] }
base64 = "0.23.1"
bytes = "1.12.2"
fast_image_resize = { version = "6.2.0", features = ["image"] }
flate2 = "1.1.11"
futures-util = "0.3.34"
http = "1.5.0"
httpdate = "1.0.3"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
object_store = { version = "0.14.2", features = ["aws"] }
parking_lot = "0.13.0"
quick_cache = "0.7.0"
rand = "0.10.4"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "form", "rustls", "stream"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
rustix = { version = "1.1.6", features = ["fs", "process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["trace", "compression-br", "compression-gzip", "compression-zstd", "limit"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.9"
webp = { version = "0.3.1", default-features = false }
libc = "0.2.191"
comrak = { version = "1.2.0", default-features = false }

# The ffmpeg sandbox (`sandbox.rs`), which only Linux has.
[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4.8"

[dev-dependencies]
# A store that counts its reads, for the single-flight test.
async-trait = "0.1"
# Extracts the templates' messages for the catalogue test.
askama_parser = "0.16"
http-body-util = "0.1.5"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }

[build-dependencies]
oxc = { version = "=0.158.0", default-features = false, features = ["codegen", "semantic", "transformer"] }
