{% import "macros.html" as m %}
<div id="grid" class="tiles">
{% for t in tiles %}
  <button type="button" class="tile" data-id="{{ t.id }}" aria-label="{{ t.label }}"
    data-url="{{ t.view }}" data-on:click="dither.show('viewer'); @get(el.dataset.url)">
    {% if let Some(done) = t.progress %}
    <span class="tile-wait"><span>{{ __p("An upload's state", "processing") }}</span>{{ self.meter(t.id, done) }}</span>
    {% else if let Some(why) = t.failure %}
    <span class="tile-wait bad" title="{% call m::failure(why) %}{% endcall %}">{{ kit::icon::WARNING.svg(18) }}<span>{{ __("couldn't process") }}</span></span>
    {% else %}
    <img src="{{ t.thumb }}" alt="" loading="lazy" decoding="async" draggable="false">
    {% endif %}
    <span class="marks">{% if t.id == cover %}<span class="mark">{{ __p("Mark on the album's cover image", "cover") }}</span>{% endif %}{% if t.animated %}<span class="mark">{{ __p("Mark on an animated image", "gif") }}</span>{% endif %}{% if let Some(length) = t.length.as_ref() %}<span class="mark" title="{{ __("video") }}">{{ length }}</span>{% endif %}{% if t.captioned %}<span class="mark" title="{{ __("has a caption") }}">¶</span>{% endif %}</span>
    <span class="tick">{{ kit::icon::CHECK.svg(13) }}</span>
  </button>
{% endfor %}
{% if tiles.is_empty() %}
  {{ kit::Empty::new(__("Nothing here yet.")).class("col-span-full") }}
{% endif %}
</div>
