<div id="albums" class="albums">
{% for c in cards %}
  <a class="card" href="/albums/{{ c.id }}">
    <span class="cover">{% if let Some(src) = c.cover.as_ref() %}<img src="{{ src }}" alt="" loading="lazy" decoding="async">{% endif %}</span>
    <span class="name{% if c.title.is_empty() %} untitled{% endif %}">{% if c.title.is_empty() %}untitled{% else %}{{ c.title }}{% endif %}</span>
    <span class="text-fine text-muted">{{ c.meta }}{% if c.private %} · private{% endif %}</span>
  </a>
{% endfor %}
{% if cards.is_empty() %}
  <p class="col-span-full text-muted">No albums yet. Drop some images in to start one.</p>
{% endif %}
</div>
