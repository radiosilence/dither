{% extends "sign/layout.html" %}
{% block title %}{{ __("join") }} · dither{% endblock %}
{% block script %}<script type="module" src="{{ join_js_url() }}"></script>{% endblock %}
{% block main %}
<h1 class="m-0">{{ __("join") }}</h1>
<p class="m-0 text-meta text-muted">{{ __("Choose a password for your account. The invite works once.") }}</p>
{% include "sign/problem.html" %}
<form method="post" action="/join" class="grid gap-4">
  <input type="hidden" name="invite" value="{{ invite }}">
  <label class="grid gap-2 text-meta">{{ __("username") }}
    <input class="w-full" name="username" autocomplete="username" readonly>
  </label>
  <label class="grid gap-2 text-meta">{{ __("password") }}
    <input class="w-full" type="password" name="password" autocomplete="new-password" minlength="8" required autofocus>
  </label>
  <label class="grid gap-2 text-meta">{{ __("password again") }}
    <input class="w-full" type="password" name="confirm" autocomplete="new-password" minlength="8" required>
  </label>
  <button class="primary">{{ __("join") }}</button>
</form>
{% endblock %}
