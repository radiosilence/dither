{% extends "public/layout.html" %}
{% block main %}
<main class="mx-auto max-w-[1000px] pt-8 pb-24 max-wide:pt-5">
  <header class="mb-6 px-[22px]">
    {% if !title.is_empty() %}<h1>{{ title }}</h1>{% endif %}
    {% if !description.is_empty() %}<p class="prose">{{ description }}</p>{% endif %}
    <p class="text-meta text-muted">{{ count }}</p>
  </header>
  {% for p in pics %}
  <figure id="{{ p.id }}" class="pic">
    <a href="/{{ p.id }}">
      <img{% if p.tall %} class="tall"{% endif %} src="{{ p.src }}"{% if !p.srcset.is_empty() %} srcset="{{ p.srcset }}" sizes="(max-width: 1000px) 100vw, 1000px"{% endif %} width="{{ p.width }}" height="{{ p.height }}" alt="{{ p.caption }}"{% if loop.first %} fetchpriority="high"{% else %} loading="lazy"{% endif %} decoding="async">
    </a>
    {% if !p.caption.is_empty() %}<figcaption class="prose">{{ p.caption }}</figcaption>{% endif %}
  </figure>
  {% endfor %}
</main>
{% endblock %}
