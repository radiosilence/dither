[tools]
# rustfmt and clippy are not in the minimal profile.
rust = { version = "latest", components = "rustfmt,clippy" }
just = "1.59.0"
"aqua:rhysd/actionlint" = "1.7.12"
"aqua:koalaman/shellcheck" = "0.11.0"
lefthook = "2.2.2"
# The Pulumi package in deploy/pulumi, and `npm version` in a release.
node = "24"
# Installs the shared theme the stylesheet imports. Exact, and the same in CI, so neither rewrites the lockfile.
aube = "2.8.5"
# Compiles styles/ into the committed assets/app.css (`just css`).
"github:tailwindlabs/tailwindcss" = "4.3.3"
# Typechecks browser/; build.rs strips its types.
"github:microsoft/typescript-go" = { version = "7.0.2", version_prefix = "typescript/v" }
